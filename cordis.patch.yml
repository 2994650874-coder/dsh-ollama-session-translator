# dsh-session-translator bundle patch: one host plugin row.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process — it owns the settings namespace, the translation engine and
# the /dsh-session-translator/* routes. The `dsh.client` declaration in package.json
# makes the browser half (exports "./client", served at
# /plugins/dsh-session-translator/client.js) load in the web GUI, where it injects the
# Chinese translation under every expanded thinking block.
- insert:
    - id: dsh-session-translator
      name: dsh-session-translator
